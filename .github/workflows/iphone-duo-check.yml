name: iPhone Duo pickup check

# While Apple has pickup switched off ("Check back for availability on ..."),
# the 5-minute schedule does one check per run. Once pickup opens, a run keeps
# checking once a minute for WATCH_MINUTES and then starts the next run itself,
# so checks continue back to back; the schedule then only restarts that chain
# if it stopped (e.g. Apple blocked a runner). Delivery dates are checked every
# 5 minutes either way.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "发一条测试提醒（确认手机能收到通知）"
        type: boolean
        default: false
      chained:
        description: "内部用：由上一轮自动启动"
        type: boolean
        default: false
  push:
    paths:
      - iphone_duo_checker.py
      - .github/workflows/iphone-duo-check.yml
      - .github/scripts/notify-issue.sh
      - .github/scripts/notify_delivery.py

permissions:
  actions: write
  contents: read
  issues: write

env:
  ZIP: "91016"
  ISSUE_TITLE: "iPhone Duo 有货可自提（91016 附近）"
  DELIVERY_ISSUE_TITLE: "iPhone Duo 寄送日期（送到 91016）"
  WATCH_MINUTES: "20"
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Test alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          url=$(gh issue create --title "【测试】iPhone Duo 提醒测试" \
                --body "@$OWNER 这是一条测试提醒。能收到这条通知，有货时也能收到。这个 issue 会自动关闭。")
          gh issue close "$url"

      # Chained runs always proceed. Anything else steps aside while another
      # run is active, so only one watcher queries Apple at a time.
      - name: Skip if another watcher is running
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHAINED: ${{ github.event_name == 'workflow_dispatch' && inputs.chained }}
        run: |
          if [ "$CHAINED" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "busy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          others=$(gh run list --workflow iphone-duo-check.yml --limit 30 --json databaseId,status,event \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .event != \"push\" and .status != \"completed\")] | length")
          echo "busy=$([ "$others" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$others" -gt 0 ] && echo "已有 $others 个检查在运行，这次跳过" || true

      - name: Check pickup (every minute once open) and delivery dates
        id: watch
        if: steps.gate.outputs.busy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # A push only smoke-tests one round.
          duration=$([ "$GITHUB_EVENT_NAME" = "push" ] && echo 0 || echo $((WATCH_MINUTES * 60)))
          set +e
          python3 iphone_duo_checker.py --zip "$ZIP" --watch 60 --duration "$duration" \
            --stop-on-block --stop-if-closed \
            --hits-file hits.txt --on-change "bash .github/scripts/notify-issue.sh hits.txt" \
            --delivery --delivery-file delivery.json \
            --on-delivery-change "python3 .github/scripts/notify_delivery.py delivery.json"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) ;;
            3) echo "自提还没开放：这次只查一轮，5 分钟后定时任务再查" ;;
            *) echo "::warning::被 Apple 拦截或查询失败（不代表没货），由定时任务稍后重启" ;;
          esac
          exit 0

      # Hand over to a fresh run (and a fresh runner IP). While pickup is closed
      # or after a block, leave the next check to the schedule instead.
      - name: Start the next run
        if: >-
          !cancelled() && github.event_name != 'push'
          && steps.gate.outputs.busy != 'true' && steps.watch.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run iphone-duo-check.yml --ref "$GITHUB_REF_NAME" -f chained=true
